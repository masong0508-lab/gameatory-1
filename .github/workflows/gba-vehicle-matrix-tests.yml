name: GBA original-vehicle matrix ROM-free tests

on:
  push:
    paths:
      - 'payback-mod/harness/vehicle_matrix.py'
      - 'payback-mod/harness/test_vehicle_matrix.py'
      - '.github/workflows/gba-vehicle-matrix-tests.yml'
  pull_request:
    paths:
      - 'payback-mod/harness/vehicle_matrix.py'
      - 'payback-mod/harness/test_vehicle_matrix.py'
      - '.github/workflows/gba-vehicle-matrix-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rom-free-original-gba-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Parse source-only mGBA test planner
        run: python3 -m compileall -q payback-mod/harness/vehicle_matrix.py payback-mod/harness/test_vehicle_matrix.py
      - name: Test original vehicle descriptor mapping and absence guards
        run: python3 -m unittest discover -s payback-mod/harness -p 'test_vehicle_matrix.py' -v
