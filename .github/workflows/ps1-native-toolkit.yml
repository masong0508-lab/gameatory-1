name: PS1 private native build toolkit

# This job intentionally has no access to the owner's ROM, generated maps,
# translations, private music or saves. It exports tracked source and the
# distro's redistributable compiler packages for offline private builds.
on:
  pull_request:
    paths:
      - ".github/workflows/ps1-native-toolkit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  toolkit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive exact tracked source
        run: |
          set -eu
          mkdir -p toolkit
          git rev-parse HEAD > toolkit/commit.txt
          git archive --format=tar.gz --prefix=gameatory-1/ HEAD ps1 stuntfox payback-mod tools README.md AGENTS.md > toolkit/source.tar.gz
          # No untracked output, owner inputs or generated private game data.
          ls -lh toolkit/source.tar.gz
      # Matching compiler kit is already available for the private build.
      - name: Package checksums
        run: |
          cd toolkit
          sha256sum source.tar.gz commit.txt > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: ps1-native-source-snapshot
          path: toolkit/
          compression-level: 0
          retention-days: 3
