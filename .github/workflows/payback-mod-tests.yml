name: Stunt Fox regression gates

concurrency:
  group: stuntfox-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

on:
  push:
    paths:
      - "payback-mod/**"
      - "stuntfox/**"
      - "ps1/**"
      - "tools/**"
      - "README.md"
      - ".github/workflows/payback-mod-tests.yml"
  pull_request:
    paths:
      - "payback-mod/**"
      - "stuntfox/**"
      - "ps1/**"
      - "tools/**"
      - "README.md"
      - ".github/workflows/payback-mod-tests.yml"
  workflow_dispatch:

jobs:
  rom-free-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install host and ARM compilers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential clang-19 lld-19 llvm-19 patch
          echo "/usr/lib/llvm-19/bin" >> "$GITHUB_PATH"
          clang-19 --version
          command -v cc
      - name: Install Python build dependencies
        run: python -m pip install -r stuntfox/requirements.txt
      - name: Syntax check
        run: python -m compileall -q payback-mod stuntfox tools ps1/tests ps1/tools
      - name: Gameplay logic, campaign saves, content and ARM/MIPS build integrity
        run: python tools/check.py --report test-results.json
      - name: Compile ARM7TDMI in-game editor
        run: |
          sh payback-mod/asm/build.sh
          python - <<'PY'
          import json, os
          symbols = json.load(open('payback-mod/paybackmod/editor.json'))
          blob = 'payback-mod/paybackmod/editor.bin'
          assert 0 < os.path.getsize(blob) < 0x10000
          assert 0x081b0000 <= (symbols['hook'] & ~1) < 0x081c0000
          assert symbols['cols'] >= 0x081b0000 + os.path.getsize(blob)
          assert symbols['maps'] == symbols['cols'] + 85 * 4
          print('ARM editor linkage and reserved tables validated')
          PY
      - name: Package source-only offline toolkit
        run: |
          tar -czf payback-mod-toolkit.tar.gz \
            --exclude='*.gba' --exclude='*.sav' --exclude='*.state' --exclude='__pycache__' \
            payback-mod
      - uses: actions/upload-artifact@v4
        with:
          name: payback-mod-offline-toolkit
          path: payback-mod-toolkit.tar.gz
          retention-days: 7
      - name: Preserve gate results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stuntfox-regression-results
          path: test-results.json
          if-no-files-found: warn
          retention-days: 7
