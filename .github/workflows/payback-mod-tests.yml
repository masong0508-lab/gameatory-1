name: Payback mod tooling tests

on:
  push:
    paths:
      - "payback-mod/**"
      - ".github/workflows/payback-mod-tests.yml"
  pull_request:
    paths:
      - "payback-mod/**"
      - ".github/workflows/payback-mod-tests.yml"
  workflow_dispatch:

jobs:
  rom-free-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax check
        run: python -m compileall -q payback-mod
      - name: Map codec, ROM bounds, and BPS patch regression tests
        run: python -m unittest discover -s payback-mod/tests -p "test_*.py" -v
