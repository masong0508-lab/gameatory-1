name: Payback mod tooling tests

on:
  push:
    paths:
      - "payback-mod/**"
      - ".github/workflows/payback-mod-tests.yml"
  pull_request:
    paths:
      - "payback-mod/**"
      - ".github/workflows/payback-mod-tests.yml"
  workflow_dispatch:

jobs:
  rom-free-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax check
        run: python -m compileall -q payback-mod
      - name: Map codec, ROM bounds, and BPS patch regression tests
        run: python -m unittest discover -s payback-mod/tests -p "test_*.py" -v
      - name: Package source-only offline toolkit
        run: |
          tar -czf payback-mod-toolkit.tar.gz \
            --exclude='*.gba' --exclude='*.sav' --exclude='__pycache__' \
            payback-mod
      - uses: actions/upload-artifact@v4
        with:
          name: payback-mod-offline-toolkit
          path: payback-mod-toolkit.tar.gz
          retention-days: 7
