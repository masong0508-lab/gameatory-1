name: Payback mod tooling tests

concurrency:
  group: payback-mod-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

on:
  push:
    paths:
      - "payback-mod/**"
      - ".github/workflows/payback-mod-tests.yml"
  pull_request:
    paths:
      - "payback-mod/**"
      - ".github/workflows/payback-mod-tests.yml"
  workflow_dispatch:

jobs:
  rom-free-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install host and ARM compilers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential clang lld llvm
          command -v cc
      - name: Syntax check
        run: python -m compileall -q payback-mod
      - name: Runtime behavior, map codec, ROM bounds and patch regression tests
        run: python -m unittest discover -s payback-mod/tests -p "test_*.py" -v
      - name: Compile ARM7TDMI in-game editor
        run: |
          sh payback-mod/asm/build.sh
          python - <<'PY'
          import json, os
          symbols = json.load(open('payback-mod/paybackmod/editor.json'))
          blob = 'payback-mod/paybackmod/editor.bin'
          assert 0 < os.path.getsize(blob) < 0x10000
          assert 0x081b0000 <= (symbols['hook'] & ~1) < 0x081c0000
          assert symbols['cols'] >= 0x081b0000 + os.path.getsize(blob)
          assert symbols['maps'] == symbols['cols'] + 85 * 4
          print('ARM editor linkage and reserved tables validated')
          PY
      - name: Package source-only offline toolkit
        run: |
          tar -czf payback-mod-toolkit.tar.gz \
            --exclude='*.gba' --exclude='*.sav' --exclude='*.state' --exclude='__pycache__' \
            payback-mod
      - uses: actions/upload-artifact@v4
        with:
          name: payback-mod-offline-toolkit
          path: payback-mod-toolkit.tar.gz
          retention-days: 7
